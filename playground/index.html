<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="q4TWpuivuU8rC4wXGzN87Hw3W7C9ZEzAC-QvO0R6T98" />
    <title>React Cursor - Lightweight Custom Cursor Library</title>
    <meta name="description" content="An easy-to-use, performant custom cursor library for React applications. Smooth animations, fully customizable." />
    <meta property="og:title" content="React Cursor Library" />
    <meta property="og:description" content="Add smooth, animated custom cursors to your React app in seconds." />
    <meta property="og:url" content="https://react-cursor-xi.vercel.app/" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <script>
      // Apply saved theme before first paint to avoid a flash
      (function () {
        var t = localStorage.getItem("playground-theme");
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
